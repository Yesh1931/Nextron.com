<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nextron - Administrative Control Console & Telemetry Probing Hub.">
    <title>Nextron | Administrative Console</title>
    
    <!-- Role Security Clearance Protection Guard -->
    <script>
        (function() {
            try {
                const currentUser = JSON.parse(localStorage.getItem('ece-current-user'));
                if (!currentUser || currentUser.role !== 'Admin') {
                    // Inject real-time CSS override to hide default structures before layout flash occurs
                    const style = document.createElement('style');
                    style.innerHTML = `
                        body > *:not(.access-denied-container) { display: none !important; }
                        body { background: #090a10 !important; display: flex !important; align-items: center !important; justify-content: center !important; min-height: 100vh !important; margin: 0 !important; }
                    `;
                    document.head.appendChild(style);
                    window.isAccessDenied = true;
                }
            } catch (e) {
                window.isAccessDenied = true;
            }
        })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- KaTeX Mathematics Rendering CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <!-- Core Admin Styles -->
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
    <!-- Real-time particle backdrop -->
    <canvas id="particle-bg"></canvas>
    
    <!-- Access Denied Screen (Only rendered/visible if window.isAccessDenied is true) -->
    <script>
        if (window.isAccessDenied) {
            document.write(`
                <div class="access-denied-container fade-in" style="
                    max-width: 480px; 
                    width: 90%; 
                    background: rgba(13, 15, 26, 0.75); 
                    border: 1px solid rgba(239, 68, 68, 0.2); 
                    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 25px rgba(239, 68, 68, 0.15); 
                    backdrop-filter: blur(20px); 
                    -webkit-backdrop-filter: blur(20px);
                    border-radius: 16px; 
                    padding: 40px; 
                    text-align: center; 
                    font-family: 'Outfit', sans-serif;
                    box-sizing: border-box;
                    margin: auto;
                    z-index: 9999;
                ">
                    <!-- Glowing Locked Shield Icon -->
                    <div style="
                        width: 80px; 
                        height: 80px; 
                        border-radius: 50%; 
                        background: rgba(239, 68, 68, 0.08); 
                        color: #ef4444; 
                        display: flex; 
                        align-items: center; 
                        justify-content: center; 
                        margin: 0 auto 24px auto;
                        box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
                        border: 2px solid rgba(239, 68, 68, 0.3);
                        animation: pulseGlow 2s infinite alternate;
                    ">
                        <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>

                    <h2 style="font-size: 1.8rem; margin: 0 0 12px 0; font-weight: 700; color: #fff; letter-spacing: -0.5px;">Security Clearance Required</h2>
                    <p style="color: #94a3b8; line-height: 1.6; font-size: 0.95rem; margin: 0 0 32px 0;">This administrative console acts as an active telemetry interface. Please connect with Level 4 credential clearance.</p>

                    <!-- Main Navigation Options -->
                    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                        <a href="./index.html#/login" style="
                            display: block; 
                            background: linear-gradient(135deg, #ef4444, #d946ef); 
                            color: white; 
                            text-decoration: none; 
                            padding: 14px; 
                            border-radius: 8px; 
                            font-weight: 600; 
                            font-size: 0.95rem;
                            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
                            transition: transform 0.2s ease;
                        " onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='none'">
                            Authenticate as Admin
                        </a>
                        <a href="./index.html" style="
                            display: block; 
                            background: rgba(255, 255, 255, 0.05); 
                            color: #f1f5f9; 
                            text-decoration: none; 
                            border: 1px solid rgba(255, 255, 255, 0.08);
                            padding: 14px; 
                            border-radius: 8px; 
                            font-weight: 600; 
                            font-size: 0.95rem;
                            transition: background 0.2s ease;
                        " onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                            Go to Student Platform
                        </a>
                    </div>

                    <!-- Developer Quick Bypass for Instant Visual Testing -->
                    <div style="
                        border-top: 1px solid rgba(255, 255, 255, 0.08); 
                        padding-top: 20px; 
                        margin-top: 24px;
                    ">
                        <button onclick="
                            try {
                                localStorage.setItem('ece-current-user', JSON.stringify({ username: 'admin', email: 'admin@nextron.edu', role: 'Admin' }));
                                localStorage.setItem('ece-student-quizzes', JSON.stringify({
                                    'signals': 100, 'networks': 100, 'pn-junction': 100, 'transistor': 100,
                                    'logic-gates': 100, 'flip-flops': 100, 'microcontrollers': 100, 'dsp': 100,
                                    'comms': 100, 'vlsi': 100, 'embedded': 100, 'optical': 100
                                }));
                                window.location.reload();
                            } catch(e) {}
                        " style="
                            background: none; 
                            border: none; 
                            color: #a855f7; 
                            cursor: pointer; 
                            font-weight: 600; 
                            font-size: 0.85rem; 
                            text-decoration: underline; 
                            outline: none;
                        ">
                            🧪 Developer Bypass (Instantly Login as Admin)
                        </button>
                    </div>
                </div>
                
                <!-- Simple animation style in DOM -->
                <style>
                    @keyframes pulseGlow {
                        from { box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); }
                        to { box-shadow: 0 0 35px rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.5); }
                    }
                </style>
            `);
        }
    </script>
    
    <!-- Standalone Admin Navbar -->
    <header class="admin-navbar">
        <a href="./index.html" class="admin-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            <span class="logo-text">Next<span>ron</span> Admin</span>
        </a>
        
        <div style="display:flex; align-items:center; gap:16px;">
            <div class="admin-user-pill">
                <div class="admin-avatar" id="admin-user-avatar">A</div>
                <span id="admin-user-label" style="font-weight:600; color:var(--text-primary);">Admin</span>
            </div>
            <button id="theme-toggle" class="btn btn-secondary" style="padding:6px 12px; border-radius:8px;" aria-label="Toggle light/dark theme">
                <i data-lucide="sun" id="theme-icon-sun" style="display:none;width:16px;height:16px;"></i>
                <i data-lucide="moon" id="theme-icon-moon" style="display:block;width:16px;height:16px;"></i>
            </button>
        </div>
    </header>
    
    <!-- Main Workspace chassis -->
    <div class="admin-container">
        <div class="admin-layout">
            <!-- Navigation Sidebar Menu -->
            <aside class="admin-sidebar" aria-label="Console Navigation Sidebar">
                <span class="admin-sidebar-title">Core Controls</span>
                <nav class="admin-sidebar-menu">
                    <button class="admin-tab-btn active" data-tab="tab-dashboard"><i data-lucide="layout-dashboard"></i> Overview</button>
                    <button class="admin-tab-btn" data-tab="tab-users"><i data-lucide="users"></i> User Manager</button>
                    <button class="admin-tab-btn" data-tab="tab-content"><i data-lucide="cpu"></i> Silicon Concepts</button>
                    <button class="admin-tab-btn" data-tab="tab-quizzes"><i data-lucide="award"></i> Quiz Manager</button>
                    <button class="admin-tab-btn" data-tab="tab-notes"><i data-lucide="book-open"></i> Study Guides</button>
                    <button class="admin-tab-btn" data-tab="tab-formulas"><i data-lucide="line-chart"></i> Formulas</button>
                    <button class="admin-tab-btn" data-tab="tab-alerts"><i data-lucide="bell"></i> Alerts Banner</button>
                    <button class="admin-tab-btn" data-tab="tab-charts"><i data-lucide="activity"></i> Analytics</button>
                    <button class="admin-tab-btn" data-tab="tab-achievements"><i data-lucide="zap"></i> Achievements</button>
                    <button class="admin-tab-btn" data-tab="tab-feedback"><i data-lucide="message-square"></i> Feedback</button>
                    <button class="admin-tab-btn" data-tab="tab-logs"><i data-lucide="shield-alert"></i> Security Logs</button>
                    <button class="admin-tab-btn" data-tab="tab-settings"><i data-lucide="settings"></i> Platform Settings</button>
                    <button class="admin-tab-btn" data-tab="tab-backup"><i data-lucide="download"></i> Backup & Export</button>
                </nav>
            </aside>
            
            <!-- Main Content Area -->
            <main class="admin-workspace" id="admin-main-viewport">
                <!-- Javascript will inject workspaces dynamically here -->
            </main>
        </div>
    </div>
    
    <!-- Shared editing form dialogs -->
    <div class="admin-modal" id="admin-form-modal" role="dialog" aria-modal="true">
        <div class="admin-modal-content" id="admin-modal-body"></div>
    </div>
    
    <!-- Main Standalone JS Exporter Entrypoint -->
    <script type="module" src="./js/admin-app.js"></script>
</body>
</html>
